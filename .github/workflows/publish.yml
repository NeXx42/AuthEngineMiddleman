name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: true
        default: "main"
    
      version:
        description: "Package version (1.2.3)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Pack
      run: |
        dotnet pack ./AuthEngineMiddleman/AuthEngineMiddleman.csproj -c Release \
          -p:PackageVersion=${{ inputs.version }}

    - name: Login to NuGet
      id: nuget
      uses: NuGet/login@v1
      with:
        user: Nexx

    - name: Push package
      run: |
        dotnet nuget push "./AuthEngineMiddleman/bin/Release/*.nupkg" \
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate